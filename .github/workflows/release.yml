name: Release plugin
on:
  workflow_dispatch:
    inputs:
      metadata_only:
        description: Backfill public update manifests without creating a release
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: crowdtest-release-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify dispatch branch
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:source
      - run: npm pack
        if: ${{ !inputs.metadata_only }}
      - name: Publish release
        if: ${{ !inputs.metadata_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/publish-update-metadata.mjs
      - name: Backfill public update manifests
        if: inputs.metadata_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/publish-update-metadata.mjs --metadata-only
