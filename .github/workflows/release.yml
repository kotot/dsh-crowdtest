name: Release plugin
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:source
      - run: npm pack
      - name: Upload install packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="dsh-crowdtest-${GITHUB_REF_NAME#v}.tgz"
          cp "$package" dsh-crowdtest.tgz
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$package" dsh-crowdtest.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$package" dsh-crowdtest.tgz --verify-tag --generate-notes
          fi
